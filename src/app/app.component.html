<div class="container">
  <header>
    <img 
      [src]="analyzer.isDarkMode ? 'assets/images/logo-dark-theme.svg' : 'assets/images/logo-light-theme.svg'" 
      alt="Logo" 
      class="logo"
    >
    <button class="theme-toggle" (click)="analyzer.toggleTheme()">
      <img 
        [src]="analyzer.isDarkMode ? 'assets/images/icon-sun.svg' : 'assets/images/icon-moon.svg'" 
        alt="Toggle Theme"
      >
    </button>
  </header>

  <h1>Analyze your text in real-time.</h1>

  <!-- TEXT INPUT -->
  <app-text-input 
    (textChanged)="analyzer.handleTextChange($event)" 
    [hasError]="analyzer.limitExceeded" 
    [maxLimit]="analyzer.limitActive ? analyzer.characterLimit : null">
  </app-text-input>

  <!-- OPTIONS ROW -->
  <div class="options-row">
    <div class="options-left">
      <div class="option-group">
        <input type="checkbox" id="exclude-spaces" (change)="analyzer.toggleExcludeSpaces($any($event.target).checked)">
        <label for="exclude-spaces">Exclude Spaces</label>
      </div>
      <div class="option-group limit-group">
        <input type="checkbox" id="set-limit" (change)="analyzer.toggleLimit($any($event.target).checked)">
        <label for="set-limit">Set Character Limit</label>
        <div class="limit-input-wrapper" *ngIf="analyzer.limitActive">
          <input 
            type="number" 
            class="limit-input" 
            [value]="analyzer.characterLimit" 
            id="limit-value" 
            (input)="analyzer.updateLimit($any($event.target).value)"
          >
        </div>
      </div>
    </div>
    <div class="reading-time">
      Approx. reading time: {{analyzer.readingTime}}
    </div>
  </div>

  <!-- STATS GRID -->
  <div class="stats-grid">
    <app-stat-card 
      label="Total Characters" 
      [value]="analyzer.totalCharacters" 
      bgClass="total-chars">
    </app-stat-card>
    
    <app-stat-card 
      label="Word Count" 
      [value]="analyzer.wordCount" 
      bgClass="word-count">
    </app-stat-card>
    
    <app-stat-card 
      label="Sentence Count" 
      [value]="analyzer.sentenceCount" 
      bgClass="sentence-count">
    </app-stat-card>
  </div>

  <!-- LETTER DENSITY -->
  <app-letter-density [text]="analyzer.currentText"></app-letter-density>

</div>
